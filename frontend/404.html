<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>404 · Not Found — Hatekhori (হাতে খড়ি)</title>
  
  <link rel="icon" type="image/png" sizes="96x96" href="favicon/favicon-96x96.png" />
  <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
  <link rel="shortcut icon" href="favicon/favicon.ico" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" />

  <style>
    :root {
      --bg: #F2ECE1;
      --fg: #111111;
      --ink: #0034D3;
      --ink-deep: #003087;
      --muted: #666666;
      --border: #DCD4C5;
      --subtle: #E8E0D2;
      --font-serif: "Instrument Serif", Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "DM Mono", monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0D0D0D;
        --fg: #F0F0F0;
        --ink: #4D7CFF;
        --ink-deep: #80A3FF;
        --muted: #888888;
        --border: #242424;
        --subtle: #141414;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .error-card {
      max-width: 520px;
      width: 100%;
      text-align: center;
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 48px 36px;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    .badge-code {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
      background: var(--subtle);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 99px;
      margin-bottom: 20px;
    }

    .glyph-mark {
      font-family: var(--font-serif);
      font-size: 56px;
      line-height: 1;
      color: var(--fg);
      margin-bottom: 16px;
      user-select: none;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 34px;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 12px;
      color: var(--fg);
    }

    p {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 28px;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--fg);
      color: var(--bg);
      text-decoration: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 4px;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .btn-home:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-home:active {
      transform: scale(0.98);
    }

    .footer-note {
      margin-top: 36px;
      font-size: 12px;
      color: var(--muted);
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>

  <main class="error-card">
    <span class="badge-code">Error 404 · পাতাটি মেলেনি</span>
    <div class="glyph-mark" aria-hidden="true">হ</div>
    <h1>Page or Font Not Found</h1>
    <p>
      The link you followed doesn't exist, was moved, or its generated font has passed the 30-day privacy retention window and was purged from our server.
    </p>
    <a href="/" class="btn-home">
      <span>Return to Hatekhori Canvas</span>
      <span aria-hidden="true">→</span>
    </a>
    <div class="footer-note">হাতে খড়ি · Digital Handwriting Atelier</div>
  </main>

</body>
</html>
