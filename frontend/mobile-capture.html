<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hatekhori — Capture</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="capture-flow">
    <h1>হাতে খড়ি</h1>

    <section class="step" id="step-capture">
      <h2>Photograph your filled sheet</h2>
      <p>Make sure all four corner squares are visible.</p>
      <input type="file" id="capture-input" accept="image/*" />
      <img id="capture-preview" alt="" hidden />
    </section>

    <section class="step" id="step-status" hidden>
      <p id="status-text">Uploading...</p>
    </section>
  </main>
  <script src="mobile-capture.js"></script>
</body>
</html>
