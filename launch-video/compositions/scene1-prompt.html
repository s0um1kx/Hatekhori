<!-- Scene 1: The Minimalist Prompt & Sheet Ingest (0.0s - 5.5s) -->
<div id="scene-prompt" class="scene absolute inset-0 flex flex-col items-center justify-center p-16 select-none bg-[#F5F2EB]" data-composition-id="scene-prompt">
  
  <!-- Subtle Cream Vignette & Minimalist Ambient Dots -->
  <div class="absolute inset-0 bg-radial-vignette opacity-50 pointer-events-none"></div>

  <!-- Central Minimalist Prompt Container -->
  <div class="relative z-10 flex flex-col items-center text-center max-w-3xl w-full">
    
    <!-- Minimalist Sun/Emblem Motif (Matching reference video opening) -->
    <div id="s1-logo-dot" class="mb-8 relative flex items-center justify-center">
      <div class="w-10 h-10 rounded-full bg-[#E85A37] flex items-center justify-center shadow-md">
        <div class="w-5 h-2.5 border-b-2 border-white/90"></div>
      </div>
    </div>

    <!-- Floating Prompt Input Bar with File Attachments (Exact reference layout) -->
    <div id="s1-prompt-bar" class="relative w-full max-w-2xl bg-white rounded-2xl shadow-[0_15px_40px_rgba(0,0,0,0.06)] border border-[#E5E0D8] p-4 flex flex-col justify-between">
      
      <!-- Attached Sheet Pills Floating In -->
      <div id="s1-attachments" class="flex items-center gap-2 mb-3">
        <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-lg bg-[#F5F2EB] border border-[#E5E0D8] text-xs font-mono text-zinc-700 shadow-sm">
          <span class="w-2 h-2 rounded-full bg-blue-500"></span>
          <span>english_90cells.png</span>
        </div>
        <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-lg bg-[#F5F2EB] border border-[#E5E0D8] text-xs font-mono text-zinc-700 shadow-sm">
          <span class="w-2 h-2 rounded-full bg-[#E85A37]"></span>
          <span>bengali_60cells.png</span>
        </div>
        <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-lg bg-[#F5F2EB] border border-[#E5E0D8] text-xs font-mono text-zinc-700 shadow-sm">
          <span class="w-2 h-2 rounded-full bg-amber-500"></span>
          <span>hindi_60cells.png</span>
        </div>
      </div>

      <!-- Typed Prompt & Submit Button -->
      <div class="flex items-center justify-between gap-4">
        <div class="flex-1 text-left">
          <span id="s1-typed-text" class="font-sans text-lg text-zinc-800 font-normal">
            Turn my real handwriting into an installable font
          </span>
          <span class="inline-block w-0.5 h-5 bg-[#E85A37] ml-0.5 animate-pulse align-middle"></span>
        </div>

        <button id="s1-submit-btn" class="w-10 h-10 rounded-full bg-black text-white flex items-center justify-center shadow-md hover:scale-105 transition-transform flex-shrink-0">
          <svg class="w-4 h-4 ml-px" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
          </svg>
        </button>
      </div>

    </div>

    <!-- Hand Cursor Clicking Submit -->
    <div id="s1-cursor" class="absolute z-30 pointer-events-none">
      <svg class="w-8 h-8 text-black drop-shadow-md" viewBox="0 0 24 24" fill="currentColor">
        <path d="M7 2l12 11.5-5.5 1.5 3.5 7-2.5 1.5-3.5-7-4 3.5z"/>
      </svg>
    </div>

    <!-- Minimalist Status Pill -->
    <div id="s1-status" class="mt-6 flex items-center gap-2 text-xs font-mono text-zinc-500 opacity-0">
      <div class="w-3.5 h-3.5 border-2 border-zinc-400 border-t-[#E85A37] rounded-full animate-spin"></div>
      <span>Vectorizing glyph contours...</span>
    </div>

  </div>
</div>
